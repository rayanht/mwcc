name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [GC_1_0, GC_1_1, GC_1_1p1, GC_1_2_5, GC_1_2_5n, GC_1_3]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build unshield

      - uses: actions/cache@v4
        with:
          path: |
            build/compilers
            lib
          key: compilers-${{ hashFiles('tools/download_tool.py') }}

      - name: Build
        run: |
          python3 configure.py --version ${{ matrix.version }}
          ninja all_source progress

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
